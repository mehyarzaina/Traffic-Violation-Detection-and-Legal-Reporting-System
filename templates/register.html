{% extends "base.html" %}
{% block title %}Create account — SmartPath Jordan{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-brand"><span class="logo-icon">🚔</span> SmartPath <em style="color:var(--red);font-style:normal">Jordan</em></div>
  <p class="auth-sub">Create an account to upload images and track your results</p>

  {% if error %}<div class="flash flash-error" style="margin-bottom:16px">{{ error }}</div>{% endif %}

  <form method="POST" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="full_name">Full name</label>
      <input class="input" id="full_name" name="full_name" autocomplete="name" value="{{ form.get('full_name', '') }}">
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none"
             value="{{ form.get('username', '') }}" required minlength="3" maxlength="50"
             pattern="[A-Za-z0-9._\-]+" title="Letters, numbers, dot, dash or underscore">
    </div>
    <div class="field">
      <label for="email">Email (optional)</label>
      <input class="input" id="email" name="email" type="email" autocomplete="email" value="{{ form.get('email', '') }}">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="6">
    </div>
    <button class="btn" type="submit">Create account</button>
  </form>

  <div class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></div>
</div>
{% endblock %}
